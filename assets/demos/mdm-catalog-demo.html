const state = { selectedIndex: null };
const countEl = document.getElementById('count');
const gridEl = document.getElementById('catalogGrid');
const searchEl = document.getElementById('searchInput');
const detailsEl = document.getElementById('detailsSection');

function getBadgeClass(value, type){ 
  if(type==='impact'){ 
    return (value && value.toLowerCase().includes('yes')) ? 'impact-yes' : 'impact-no'; 
  } 
  if(type==='audience'){ 
    if(!value) return 'audience-static'; 
    const v=value.toLowerCase(); 
    if(v.includes('configurable')) return 'audience-config'; 
    if(v.includes('reserved')||v.includes('r&d')) return 'audience-rd'; 
    if(v.includes('static')) return 'audience-static'; 
    return 'audience-static'; 
  } 
  return ''; 
}

function renderCatalog(list){ 
  countEl.textContent = String(list.length).trim();
  gridEl.innerHTML=''; 
  list.forEach((item, idx)=>{ 
    const card=document.createElement('div'); 
    card.className='catalog-item'+(state.selectedIndex===idx?' active':''); 
    card.onclick=()=>{ 
      state.selectedIndex=(state.selectedIndex===idx)?null:idx; 
      renderCatalog(list); 
      renderDetails(); 
    }; 
    
    const top=document.createElement('div'); 
    top.className='catalog-top'; 
    const title=document.createElement('h3'); 
    title.className='catalog-title'; 
    title.textContent=item.table; 
    const chevron=document.createElement('div'); 
    chevron.textContent= state.selectedIndex===idx ? '▾':'▸'; 
    top.appendChild(title); 
    top.appendChild(chevron); 
    card.appendChild(top); 
    
    const mdm=document.createElement('div'); 
    mdm.className='mdm-pill'; 
    mdm.textContent=item.mdmTableName; 
    card.appendChild(mdm); 
    
    const p=document.createElement('p'); 
    p.style.margin=0; 
    p.style.fontSize='.875rem'; 
    p.style.lineHeight='1.5'; 
    p.textContent=item.usage; 
    card.appendChild(p); 
    
    const badges=document.createElement('div'); 
    badges.className='badges'; 
    const b1=document.createElement('span'); 
    b1.className='badge '+getBadgeClass(item.podRestartImpact,'impact'); 
    b1.textContent='Pod Impact: '+(item.podRestartImpact || 'No'); 
    badges.appendChild(b1); 
    
    if(item.audience){ 
      const b2=document.createElement('span'); 
      b2.className='badge '+getBadgeClass(item.audience,'audience'); 
      b2.textContent=item.audience; 
      badges.appendChild(b2);
    } 
    card.appendChild(badges); 
    gridEl.appendChild(card); 
  }); 
}

function renderDetails(){ 
  detailsEl.innerHTML=''; 
  if(state.selectedIndex===null){ 
    detailsEl.classList.add('hidden'); 
    return;
  } 
  detailsEl.classList.remove('hidden'); 
  
  const item=(searchEl.value ? filteredData() : catalogData)[state.selectedIndex]; 
  
  const h2=document.createElement('h2'); 
  h2.textContent=item.table; 
  detailsEl.appendChild(h2); 
  
  const info=document.createElement('div'); 
  info.className='info-grid'; 
  const infoItems=[ 
    ['MDM Table Name', item.mdmTableName], 
    ['Read/Write', item.readWrite], 
    ['Pod Restart Impact', item.podRestartImpact || 'No'], 
    ['Requires Update Ref Data', item.requiresUpdateRefData] 
  ]; 
  
  infoItems.forEach(([label, value])=>{ 
    const card=document.createElement('div'); 
    card.className='info-card'; 
    const l=document.createElement('div'); 
    l.className='info-label'; 
    l.textContent=label; 
    card.appendChild(l); 
    const v=document.createElement('div'); 
    v.className='info-value'; 
    v.textContent=value || ''; 
    card.appendChild(v); 
    info.appendChild(card); 
  }); 
  detailsEl.appendChild(info); 
  
  if(item.functionalities){ 
    const funcWrap=document.createElement('div'); 
    funcWrap.style.marginBottom='1.5rem'; 
    const h4=document.createElement('h4'); 
    h4.style.color='var(--darkGray)'; 
    h4.style.marginBottom='.5rem'; 
    h4.style.fontSize='.875rem'; 
    h4.style.fontWeight='600'; 
    h4.style.textTransform='uppercase'; 
    h4.textContent='Functionalities'; 
    funcWrap.appendChild(h4); 
    const p=document.createElement('p'); 
    p.style.margin=0; 
    p.style.lineHeight='1.6'; 
    p.textContent=item.functionalities; 
    funcWrap.appendChild(p); 
    detailsEl.appendChild(funcWrap);
  } 
  
  if(item.notes){ 
    const note=document.createElement('div'); 
    note.className='note'; 
    note.innerHTML='<strong style="color: var(--orange)">Note:</strong> '+item.notes; 
    detailsEl.appendChild(note);
  } 
  
  const fieldsWrap=document.createElement('div'); 
  fieldsWrap.className='fields'; 
  const h3=document.createElement('h3'); 
  h3.textContent='Field Definitions'; 
  fieldsWrap.appendChild(h3); 
  
  const table=document.createElement('table'); 
  const thead=document.createElement('thead'); 
  const trh=document.createElement('tr'); 
  ['Field Name','Description','Mandatory','Example','Data Type','Note'].forEach(h=>{ 
    const th=document.createElement('th'); 
    th.textContent=h; 
    trh.appendChild(th);
  }); 
  thead.appendChild(trh); 
  table.appendChild(thead); 
  
  const tbody=document.createElement('tbody'); 
  const fields=item.fields || []; 
  
  if(!fields.length){ 
    const tr=document.createElement('tr'); 
    const td=document.createElement('td'); 
    td.colSpan=6; 
    td.textContent='No field metadata found for this table.'; 
    tr.appendChild(td); 
    tbody.appendChild(tr);
  } else { 
    fields.forEach(f=>{ 
      const tr=document.createElement('tr'); 
      
      const tdName=document.createElement('td'); 
      tdName.className='name'; 
      tdName.textContent=f.name || ''; 
      tr.appendChild(tdName); 
      
      const tdDesc=document.createElement('td'); 
      tdDesc.textContent=f.description || ''; 
      tr.appendChild(tdDesc); 
      
      const tdMan=document.createElement('td'); 
      tdMan.style.textAlign='center'; 
      tdMan.textContent=f.mandatory || ''; 
      tr.appendChild(tdMan); 
      
      const tdEx=document.createElement('td'); 
      tdEx.style.fontFamily='monospace'; 
      tdEx.style.fontSize='.8125rem'; 
      tdEx.style.color='var(--steel)'; 
      tdEx.textContent=f.example || ''; 
      tr.appendChild(tdEx); 
      
      const tdType=document.createElement('td'); 
      tdType.className='datatype'; 
      tdType.textContent=f.dataType || ''; 
      tr.appendChild(tdType); 
      
      const tdNote=document.createElement('td'); 
      tdNote.textContent=f.note || ''; 
      tr.appendChild(tdNote); 
      
      tbody.appendChild(tr); 
    }); 
  } 
  
  table.appendChild(tbody); 
  fieldsWrap.appendChild(table); 
  detailsEl.appendChild(fieldsWrap); 
}

function filteredData(){ 
  const q=searchEl.value.trim().toLowerCase(); 
  if(!q) return catalogData; 
  return catalogData.filter(item=> (
    (item.table || '').toLowerCase().includes(q) || 
    (item.mdmTableName || '').toLowerCase().includes(q) || 
    (item.usage || '').toLowerCase().includes(q)
  )); 
}

function refresh(){ 
  const data=filteredData(); 
  state.selectedIndex=null; 
  renderCatalog(data); 
  renderDetails(); 
}

searchEl.addEventListener('input', refresh);
renderCatalog(catalogData); 
renderDetails();
</script>
